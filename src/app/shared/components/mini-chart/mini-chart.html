<svg class="mini-chart" [attr.viewBox]="'0 0 ' + width + ' ' + height" role="img" [attr.aria-label]="legend()">

  @if (values().length === 0) {

    <text class="empty-text" [attr.x]="width / 2" [attr.y]="height / 2" text-anchor="middle">
      Sin datos para mostrar
    </text>

  } @else {

    <!-- leyenda -->
    <rect class="bar" [attr.x]="width / 2 - 50" y="8" width="14" height="12"></rect>
    <text class="legend-text" [attr.x]="width / 2 - 30" y="19">{{ legend() }}</text>

    <!-- cuadrícula y eje Y -->
    @for (tick of model().ticks; track $index) {
      <line
        class="grid-line"
        [attr.x1]="padLeft"
        [attr.x2]="width - padRight"
        [attr.y1]="tick.y"
        [attr.y2]="tick.y"
      ></line>
      <text class="axis-text" [attr.x]="padLeft - 8" [attr.y]="tick.y + 4" text-anchor="end">{{ tick.text }}</text>
    }

    <!-- datos -->
    @if (type() === 'bar') {

      @for (p of model().points; track $index) {
        <rect class="bar" [attr.x]="p.x" [attr.y]="p.y" [attr.width]="p.width" [attr.height]="p.height">
          <title>{{ p.label }}: {{ p.value }}</title>
        </rect>
        <text class="value-text" [attr.x]="p.cx" [attr.y]="p.y - 5" text-anchor="middle">{{ p.value }}</text>
      }

    } @else {

      <polyline class="line" [attr.points]="model().polyline"></polyline>

      @for (p of model().points; track $index) {
        <circle class="dot" [attr.cx]="p.cx" [attr.cy]="p.y" r="4.5">
          <title>{{ p.label }}: {{ p.value }}</title>
        </circle>
        <text class="value-text" [attr.x]="p.cx" [attr.y]="p.y - 10" text-anchor="middle">{{ p.value }}</text>
      }

    }

    <!-- etiquetas del eje X -->
    @for (p of model().points; track $index) {
      <text
        class="axis-text"
        [attr.x]="p.cx"
        [attr.y]="labelY"
        [attr.text-anchor]="model().rotate ? 'end' : 'middle'"
        [attr.transform]="model().rotate ? 'rotate(-30 ' + p.cx + ' ' + labelY + ')' : null"
      >{{ p.label }}</text>
    }

  }

</svg>
