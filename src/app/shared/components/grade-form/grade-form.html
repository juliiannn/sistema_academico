<form class="grade" (submit)="submit($event)">
  <label class="grade-input">
    <span>Nota (0 a 10)</span>
    <input type="number" min="0" max="10" step="0.1" [value]="gradeText()" (input)="onGrade($event)">
  </label>
  <label>
    <span>Retroalimentación</span>
    <textarea rows="3" maxlength="2000" [value]="feedbackText()" (input)="onFeedback($event)" placeholder="Escribe tu respuesta al estudiante..."></textarea>
  </label>

  @if (error()) {
    <app-alert type="error">{{ error() }}</app-alert>
  }

  <app-button type="submit" [disabled]="saving()">{{ saving() ? 'Guardando...' : submitLabel() }}</app-button>
</form>
