<div class="pw">
  <ng-content />
  <button type="button" class="pw-eye" (click)="toggle()"
          [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.title]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
    @if (visible()) {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.1A9.8 9.8 0 0112 5c5 0 9 4.5 10 7-.4 1-1.3 2.5-2.7 3.8M6.1 6.1C3.9 7.5 2.5 9.6 2 12c1 2.5 5 7 10 7 1.7 0 3.3-.5 4.6-1.2"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    }
  </button>
</div>
