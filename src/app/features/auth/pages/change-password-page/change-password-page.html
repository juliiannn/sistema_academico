<main class="login-card">
  <app-logo />

  <h1>Cambiar contraseña</h1>

  <form [formGroup]="form" (ngSubmit)="save()">

    <app-form-field label="Contraseña actual">
      <app-password-toggle><input id="currentPassword" type="password" formControlName="currentPassword"></app-password-toggle>
    </app-form-field>

    <app-form-field label="Nueva contraseña">
      <app-password-toggle><input id="newPassword" type="password" formControlName="newPassword"></app-password-toggle>
    </app-form-field>

    <app-button type="submit" [block]="true" [disabled]="saving()">{{ saving() ? 'Cambiando...' : 'Cambiar contraseña' }}</app-button>

  </form>

  <app-alert [type]="isError() ? 'error' : 'info'">{{ message() }}</app-alert>
</main>
