<main class="login-card">
  <app-logo />

  <h1>Cambiar contraseña</h1>

  <form [formGroup]="form" (ngSubmit)="save()">

    <app-form-field label="Contraseña actual">
      <input id="currentPassword" type="password" formControlName="currentPassword">
    </app-form-field>

    <app-form-field label="Nueva contraseña">
      <input id="newPassword" type="password" formControlName="newPassword">
    </app-form-field>

    <app-button type="submit" [block]="true">Cambiar contraseña</app-button>

  </form>

  <app-alert [type]="isError() ? 'error' : 'info'">{{ message() }}</app-alert>
</main>
