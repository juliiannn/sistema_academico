<main class="login-card">
  <app-logo />
  <h1>Bienvenido</h1>
  <p class="muted">Ingresa al Sistema Académico</p>

  <form [formGroup]="form" (ngSubmit)="login()">

    <app-form-field label="Correo electrónico">
      <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="correo&#64;institucion.edu">
    </app-form-field>

    <app-form-field label="Contraseña">
      <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••">
    </app-form-field>

    <app-button type="submit" [block]="true">Iniciar sesión</app-button>

  </form>

  <app-alert [type]="isError() ? 'error' : 'info'">{{ message() }}</app-alert>

  <p class="muted" style="text-align:center; margin-top: 14px;">
    <a href="#" (click)="forgotPassword($event)">¿Olvidaste tu contraseña?</a>
  </p>
</main>
